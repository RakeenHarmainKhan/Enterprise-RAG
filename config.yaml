# Generated by GitHub Copilot - Nov-01-2026
# Local Windows laptop profile; activate with env.laptop.example.
llm:
  provider: ollama_chat
  model: qwen2.5:1.5b
  temperature: 0.2
  max_tokens: 512
  timeout_seconds: 120

ingestion:
  parser: pdf
  chunker: recursive
  embedder: local
  indexer: opensearch
  parser_params: {}
  chunker_params:
    chunk_size: 512
    chunk_overlap: 64
  embedder_params:
    model: all-MiniLM-L6-v2
    batch_size: 16
  indexer_params:
    index_name: enterprise_rag_local_minilm_chunks

retrieval:
  router: hybrid
  strategies:
    - name: dense
      weight: 0.5
      params:
        k: 20
    - name: sparse
      weight: 0.5
      params:
        k: 20
  fusion: rrf
  fusion_params:
    k: 60
  reranker: cross_encoder
  reranker_params:
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_k: 8

generation:
  # Generated by GitHub Copilot - Nov-10-2026
  context_window_tokens: 4000
  streaming: true
  citation_style: bracket

guardrails:
  input_chain:
    - plugin: pii_detector
      params:
        use_llm: false
        action: redact
    - plugin: topic_filter
      params:
        allowed_topics: []
        action: warn
  output_chain:
    - plugin: toxicity_filter
      params:
        threshold: 0.85
        action: block
    - plugin: hallucination_checker
      params:
        entailment_threshold: 0.35
        action: warn

evaluation:
  metrics:
    - faithfulness
    - answer_relevance
    - context_precision
    - context_recall

cache:
  backend: redis
  ttl_seconds: 3600
  similarity_threshold: 0.9

observability:
  langfuse_enabled: false
  tracing: false
